{% extends 'store/base.html' %}
{% block content %}

<div class="card p-4 mx-auto" style="max-width: 500px;">
    <h3 class="text-center mb-3">Checkout</h3>

    <p class="text-center">
        Click below to proceed with secure payment
    </p>

    <!-- ✅ ONLY ONE FORM -->
    <form method="post" action="{% url 'create_checkout_session' %}">
        {% csrf_token %}
        <button class="btn btn-primary w-100">
            Pay with Stripe
        </button>
    </form>
</div>

{% endblock %}
