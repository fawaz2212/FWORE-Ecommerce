<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>
</head>
<body>
    <h1>Your Cart</h1>
    <ul>
        {% for item in order.orderitem_set.all %}
            <li>{{ item.product.name }} ({{ item.quantity }})</li>
        {% endfor %}
    </ul>
    <a href="{% url 'store:checkout' %}">Checkout</a>
</body>
</html>
