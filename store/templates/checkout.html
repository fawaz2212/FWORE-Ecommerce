
{% extends 'store/base.html' %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-7">

            <div class="card shadow border-0 p-4">

                <h3 class="fw-bold mb-2">Checkout</h3>
                <p class="text-muted">Enter your delivery information.</p>

                <form method="POST" action="{% url 'create_checkout_session' %}">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text"
                               name="full_name"
                               class="form-control"
                               value="{{ profile.full_name }}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email"
                               name="email"
                               class="form-control"
                               value="{{ user.email }}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="text"
                               name="phone"
                               class="form-control"
                               value="{{ profile.phone }}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Delivery Address</label>
                        <textarea name="address"
                                  class="form-control"
                                  rows="3"
                                  required>{{ profile.address }}</textarea>
                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">City</label>
                            <input type="text"
                                   name="city"
                                   class="form-control"
                                   value="{{ profile.city }}"
                                   required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Postal Code</label>
                            <input type="text"
                                   name="postal_code"
                                   class="form-control"
                                   value="{{ profile.postal_code }}"
                                   required>
                        </div>

                    </div>

                    <hr>

                    <h5 class="fw-bold">Order Summary</h5>

                    {% for item in items %}
                    <div class="d-flex justify-content-between mb-2">
                        <span>
                            {{ item.product.name }} × {{ item.qty }}
                        </span>
                        <span>₹{{ item.subtotal }}</span>
                    </div>
                    {% endfor %}

                    <hr>

                    <div class="d-flex justify-content-between mb-4">
                        <h5>Total Amount</h5>
                        <h5 class="fw-bold text-success">₹{{ total }}</h5>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2">
                        Pay ₹{{ total }} with Stripe
                    </button>

                </form>

            </div>

        </div>
    </div>

</div>

{% endblock %}
